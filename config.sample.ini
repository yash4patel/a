[DEFAULT]
tenant_name = AvadianCual
sid = 5713
data_path = /path/to/ach/files
log_path = ./log
extension = ACH
max_bad_file = 7
max_bad_secs = 4
max_bad_keys = 4
max_bad_first_file_line = 4
max_bad_line_length = 4
max_out_of_order = 4
max_bad_addendum = 4
full_file_path = False
show_problem_lines = True
problem_line_limit = 10
problem_line_types = 5,6
match_risk_engine = False
max_error_percent = 2
sec_codes = ARC, CBR, CCD, CIE, COR, CTX, MTE, PBR, POP, POS, PPD, RCK, TEL, WEB, ENR, IAT, BOC, DNE
log_level = INFO
update_delta = 5
is_folded = True

# Filename date/time extraction (optional; Section 3 / Batch Date Completeness)
# -----------------------------------------------------------------------------
# Preferred behavior: PSE provides `filenameformat` in `config.ini`.
# - If `filenameformat = GENERIC`, Section 3 uses the standard pattern:
#     ACH_<13-digit-epoch-ms>_<YYYYMMDDHHmmss or YYMMDDHHmmss>_*.ACH
# - If customers cannot include epoch-ms, set `filenameformat` to a non-GENERIC
#   value (e.g., CUSTOM) and configure DATE/TIME extraction positions (substring/regex)
#   below. This avoids any guessing/prompting at runtime.
#
# filenameformat:
# - GENERIC: use ACH_<epoch-ms>_<dateTime>_... (preferred/default)
# - CUSTOM (or anything else): use substring/regex config below
filenameformat =
#
# Modes (used for CUSTOM):
# - auto: analyzer auto-detects date tokens from filenames (default)
# - substring: use 0-based slices on the basename (end exclusive)
# - regex: use a regex with named groups
#
# Common options
filename_datetime_mode = auto
filename_datetime_strip_extension = True
filename_datetime_strip_non_digits = True
# Two-digit year (YYMMDD) => (base + YY) when YY <= max
filename_two_digit_year_base = 2000
filename_two_digit_year_max = 50
# If True and no configured rule works, allow interactive prompting (legacy behavior).
allow_manual_filename_date_prompt = False
#
# Example A (GENERIC / preferred)
#   ACH_<13-digit-epoch-ms>_<YYMMDDHHMMSS>_*.ACH
#   ACH_1778498103121_260511061503_DSM_101115030_486041114.ACH
# filenameformat = GENERIC
#
# If this is not possible for a customer, use CUSTOM and specify DATE/TIME positions:
# Extract YYMMDD from positions 18:24 and HHMMSS from 24:30 (then append ms "000" if desired)
# filenameformat = CUSTOM
# filename_datetime_mode = substring
# filename_date_slice = 18:24
# filename_time_slice = 24:30
# filename_time_suffix = 000
#
# Example B
#   ACH_<FI_ABA#>_YYYYMMDDHHMMSS_*.ACH
#   ACH_322079353_20260508170425_APORIG.ACH
# filename_datetime_mode = substring
# filename_date_slice = 14:22
# filename_time_slice = 22:28
#
# Example C
#   YYYY-MM-DD-HHMMSS_<optional>.$<optional>$.ACH
#   2026-05-11-095302_034VHR114524860.A004_A455_SST.$A455VHR3P$.ACH
# filename_datetime_mode = substring
# filename_date_slice = 0:10
# filename_time_slice = 11:17
#
# Regex alternative (recommended when formats vary but still deterministic):
# Note: INI values are passed directly to Python's regex engine; use single backslashes.
# filename_datetime_mode = regex
# filename_datetime_regex = ^ACH_\d{13}_(?P<date>\d{6})(?P<time>\d{6})_
# or:
# filename_datetime_regex = ^ACH_\d{9}_(?P<date>\d{8})(?P<time>\d{6})

# Performance estimation (optional)
# If enabled, the run writes per-section timings and throughput into the JSON report
# and logs an estimated backfill time for historical processing (based on provided totals).
perf_enabled = True
# Provide either approximate historical totals (for production backfill estimate):
# - total bytes (preferred)
# - or total GB
# - or total file count (used with observed avg bytes/file)
perf_historical_total_bytes =
perf_historical_total_gb =
perf_historical_total_files =
# If you plan to run N workers in parallel in production, set this to scale the estimate.
perf_parallel_workers = 1
# Optional: cap file-size sampling for faster startup on huge folders
perf_max_files_for_size_stats = 2000

# AI agent summary (optional)
# If enabled, `run_all.py` will automatically generate:
# - <report>.ai_summary.md
# - <report>.ai_summary.json
ai_summary_enabled = True
# If True, generates a deterministic summary without any model calls.
ai_summary_dry_run = True
# Provide an on-prem Ollama URL + model if you want LLM-assisted write-up.
# Example:
#   ollama_base_url = http://localhost:11434
#   ollama_model = llama3
# Or if you're using the US6 VM as your Ollama gateway, set the base URL to that host.
# Example:
#   ollama_base_url = http://crewai-01.qa.us6.fm-hosted.com:11434
ollama_base_url =
ollama_model =
# Include encoding_integrity samples in the LLM input (still strips raw previews).
ai_include_sanitized_samples = False
ai_max_samples = 20
# Allow filenames/line numbers in LLM input (NOT recommended unless strictly on-prem).
ai_allow_sensitive_evidence = False
ai_timeout_s = 180

# Metadata-driven checking (in-code metadata object)
# Section 3 (Batch Date Completeness) is driven by an internal metadata object, with optional scalar overrides below.

# ACH MDV validator metadata overrides (optional; JSON).
# Provide either a JSON file path OR inline JSON.
# If both are set, `ach_mdv_metadata_path` takes precedence.
# Examples:
#   ach_mdv_metadata_path = ./ach_mdv_validator.metadata.json
#   ach_mdv_metadata_json = {"checks":{"Bad SEC Codes":{"enabled":false}}}
ach_mdv_metadata_path = ./ach_mdv_validator.metadata.json
ach_mdv_metadata_json =

# Batch date completeness metadata overrides (optional; JSON).
# Provide either a JSON file path OR inline JSON.
# If both are set, `batch_data_metadata_path` takes precedence.
# Examples:
#   batch_data_metadata_path = ./batch_data_check.metadata.json
#   batch_data_metadata_json = {"calendar":{"exclude_weekends":false}}
batch_data_metadata_path = ./batch_data_check.metadata.json
batch_data_metadata_json =

# Batch date completeness overrides (optional; usually set via metadata)
# These are the defaults if not overridden:
# - ODFI: 90 days
# - RDFI: 180 days
# If set, they affect Section 3 pass/fail requirement.
batch_needed_days_odfi = 90
batch_needed_days_rdfi = 180
# Default record type to count for date completeness (5=batch headers). Metadata can override.
batch_record_type_to_count = 5

# Bank routing ABA number(s) used for "Retail ODFI indicator" classification.
# Implementation is equivalent to:
#   grep '^5' *.ACH | cut -c41-50
# and then checking whether that extracted value matches any configured ABA
# (exact 9-digit match, or 8-digit match with check digit removed).
#
# You can provide multiple ABAs (comma/space-separated), e.g.:
#   aba_number = 123456789, 021000021
aba_number =

# ABA entropy analyzer metadata overrides (optional; JSON).
# Provide either a JSON file path OR inline JSON.
# If both are set, `aba_entropy_metadata_path` takes precedence.
# Examples:
#   aba_entropy_metadata_path = ./aba_entropy.metadata.json
#   aba_entropy_metadata_json = {"decision":{"operator":">="}}
aba_entropy_metadata_path = ./aba_entropy.metadata.json
aba_entropy_metadata_json =

